name: Build TVS Raider APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          TARGET_DIR="."
          if [ ! -f "build.gradle.kts" ] && [ -d "Raider" ] && [ -f "Raider/build.gradle.kts" ]; then
            TARGET_DIR="Raider"
          fi
          cd "$TARGET_DIR"
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Run Unit Tests
        run: |
          TARGET_DIR="."
          if [ ! -f "build.gradle.kts" ] && [ -d "Raider" ] && [ -f "Raider/build.gradle.kts" ]; then
            TARGET_DIR="Raider"
          fi
          cd "$TARGET_DIR"
          ./gradlew test --stacktrace || gradle test --stacktrace

      - name: Build Obfuscated Release APK
        run: |
          TARGET_DIR="."
          if [ ! -f "build.gradle.kts" ] && [ -d "Raider" ] && [ -f "Raider/build.gradle.kts" ]; then
            TARGET_DIR="Raider"
          fi
          cd "$TARGET_DIR"
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          APK_PATH=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" output/TVS-Raider-v1.0.0.apk
          else
            echo "ERROR: No APK was generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVS-Raider-App-APK
          path: output/TVS-Raider-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/TVS-Raider-v1.0.0.apk
          name: TVS Raider Navigations ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
